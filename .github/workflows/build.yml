name: Build & Sign LocalConnect APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Gradle 8.7 và cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Tạo keystore tự ký (self-signed). Nếu bạn đã lưu keystore riêng trong Secrets
      # (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)
      # thì workflow sẽ dùng đúng keystore đó để mọi bản build có cùng 1 chữ ký (cần cho việc
      # cài đè bản cập nhật sau này). Nếu chưa có Secrets, workflow sẽ TỰ SINH keystore mới ở
      # mỗi lần build và tải nó lên như một artifact — bạn nên tải về, lưu lại rồi add vào
      # Secrets để các lần build sau dùng lại đúng keystore đó.
      - name: Chuẩn bị keystore ký ứng dụng
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Dùng keystore có sẵn từ GitHub Secrets"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Không thấy Secrets, tự sinh keystore mới (self-signed) cho lần build này"
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias localconnect \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "localconnect123" \
              -keypass "localconnect123" \
              -dname "CN=LocalConnect, OU=Dev, O=LocalConnect, L=Hanoi, S=Hanoi, C=VN"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release (đã ký)
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'localconnect123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'localconnect' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'localconnect123' }}
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Tải lên APK đã ký (cài trực tiếp trên điện thoại)
        uses: actions/upload-artifact@v4
        with:
          name: LocalConnect-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Nếu keystore vừa được tự sinh (chưa có trong Secrets), lưu lại để bạn tải về và add
      # vào Secrets (RELEASE_KEYSTORE_BASE64) cho các lần build sau dùng chung 1 chữ ký.
      - name: Tải lên keystore vừa sinh (chỉ khi tự sinh mới)
        if: steps.keystore.outputs.reused == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: generated-release-keystore-KEEP-SAFE
          path: keystore/release.jks
